[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    integration: requires a running backend or live API (skipped in CI by default)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
