name: Backend CI

on:
  push:
    branches: ["main", "feature/**"]
    paths:
      - "extension/backend/**"
  pull_request:
    branches: ["main"]
    paths:
      - "extension/backend/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./extension/backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- DÜZELTME: Manuel Disk Temizliği (Action kullanmadan) ---
      - name: Free Disk Space (Manual)
        run: |
          echo "Listing initial space..."
          df -h

          echo "Removing large directories..."
          # Gereksiz Android SDK'ları sil (~2GB)
          sudo rm -rf /usr/local/lib/android
          # Gereksiz .NET SDK'ları sil (~500MB)
          sudo rm -rf /usr/share/dotnet
          # Gereksiz Haskell derleyicisini sil (~500MB)
          sudo rm -rf /opt/ghc
          # Docker imajlarını temizle
          sudo docker image prune --all --force

          echo "Space after cleanup..."
          df -h

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          # 1. CPU Versiyon Torch Yükle (Disk dolmasını asıl önleyen bu)
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

          # 2. Diğer Gereksinimleri Yükle
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

          # 3. Test Araçlarını Yükle
          pip install pytest pytest-cov httpx pyright

      - name: Check Syntax (Compile Check)
        run: |
          python -m compileall .

      - name: Run Unit Tests with Coverage Gate
        run: |
          pytest -m "not integration" --cov=. --cov-report=term --cov-report=xml --cov-fail-under=60

      - name: Static Type Check (Pyright)
        # Non-blocking initially; tighten to required gate once existing
        # type errors are addressed (tracked under EMSE Phase 0 cleanup).
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          pyright
